<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Offline workspace</title>
<style>
:root{--bg:#fafafa;--surface:#fff;--text:#18181b;--muted:#63636d;--line:#e4e4e7;--soft:#f4f4f5;--blue:#2458db}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",sans-serif}body.dark{--bg:#09090b;--surface:#141416;--text:#fafafa;--muted:#a1a1aa;--line:#303035;--soft:#1b1b1e;--blue:#86a5ff}
button,input,select{font:inherit;color:inherit}button,a,input,select{outline-offset:3px}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:240px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}.brand{font-size:25px;font-weight:650;letter-spacing:-1px;padding:0 10px 24px}.brand b{color:var(--blue)}nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:9px 12px;margin:3px 0;color:var(--muted);border-radius:6px;font-size:13px}nav button.active,nav button:hover{background:var(--soft);color:var(--text)}main{margin-left:240px}header{min-height:54px;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 24px;border-bottom:1px solid var(--line);font-size:12px;background:var(--surface)}button,.action{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 12px}.primary{background:var(--blue);color:var(--surface);border-color:var(--blue)}article{max-width:1200px;padding:24px;margin:auto}h1{font-size:26px;line-height:1.3;letter-spacing:-.5px;margin:0 0 6px}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0 0 8px}p{margin:6px 0;color:var(--muted)}.intro{font-size:13px;margin-bottom:22px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:18px;margin-bottom:20px}.stats{display:flex;gap:40px;margin-bottom:24px}.stats small{display:block;color:var(--muted)}.stats strong{display:block;font-size:24px}.badge{display:inline-block;color:var(--blue);background:var(--soft);padding:3px 8px;border:1px solid var(--line);border-radius:5px;font-size:12px}.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.task input{width:18px;height:18px;accent-color:var(--blue)}.task span{flex:1}.task:has(input:checked) span{text-decoration:line-through;color:var(--muted)}.notice{font-size:12px;margin-top:20px}.map{overflow:hidden;background:var(--soft);border:1px solid var(--line);border-radius:6px;margin-top:15px}.map svg{display:block;width:100%;max-height:340px;fill:#d4dfe5;stroke:var(--line);stroke-width:.3}.map .flight{stroke:var(--blue);fill:none;stroke-width:1.2}.map text{fill:var(--text);stroke:none;font-size:6px}.dark .map svg{fill:#28323c}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px}label input,label select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:8px}.task input{display:inline;width:18px;margin:0}a{color:var(--blue)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.message{white-space:pre-wrap;padding:12px 0;border-bottom:1px solid var(--line)}.message strong{display:block;margin-bottom:5px}footer{padding:20px 24px;font-size:11px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:800px){aside{position:static;width:auto;padding:14px}aside .brand{padding-bottom:10px}nav{display:flex;overflow:auto}nav button{width:auto;flex-shrink:0}aside .notice{display:none}main{margin:0}header{padding:10px 16px}article{padding:20px 16px}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.stats{gap:24px}button{min-height:40px}}
.map .route-label,.map .map-airplane,.map .map-coordinates{display:none}.map .map-lines{width:100%;height:auto;min-height:150px;max-height:280px}.map .map-lines .flight{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.map .map-lines circle{fill:var(--blue);stroke:var(--surface);stroke-width:2}.map .map-lines text{fill:var(--text);font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
</head>
<body>
<aside><div class="brand">meridian<b>.</b></div><nav aria-label="Main navigation"></nav><p class="notice">Browser-only fallback<br>No installation or server required.</p></aside>
<main><header><span id="crumb">Overview</span><div><button id="assistant">Assistant</button> <button id="theme" aria-label="Toggle theme">Switch appearance</button></div></header><article id="content"></article><footer>Offline fallback — government systems are not connected. Changes last for this window.</footer></main>
<template id="map-template">__MAP__</template>
<script>
"use strict";
const pages=["Overview","Journeys","Visa & entry","Applications","Documents","Tasks","Travel","Arrival","Expenses","Settings"];
const state={name:"Preview traveler",nationality:"India",residence:"India",destination:"United Kingdom",city:"London",origin:"Mumbai",transit:"Doha, Qatar",purpose:"Study",date:"2027-09-15",docs:[],done:new Set(),application:0,messages:[]};
const content=document.querySelector("#content"),nav=document.querySelector("nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const source=()=>state.destination==="United Kingdom"?"https://www.gov.uk/check-uk-visa":state.destination==="Japan"?"https://www.mofa.go.jp/j_info/visit/visa/index.html":"https://www.gov.uk/foreign-travel-advice";
const categories=()=>state.purpose==="Study"?["Passport validity","Admission documentation","Immigration permission","Financial evidence","Accommodation","Healthcare arrangements"]:state.purpose==="Work"?["Passport validity","Work permission","Employer documentation","Accommodation"]:["Passport validity","Entry permission","Travel itinerary","Accommodation","Insurance review"];
const tasks=()=>["Confirm "+state.purpose.toLowerCase()+" permission for "+state.destination,...categories().map(c=>"Review "+c.toLowerCase()),...(state.transit?["Check transit conditions for "+state.transit]:[])];
const heading=(title,description)=>"<h1>"+title+"</h1><p class='intro'>"+esc(description)+"</p>";
const airports=[
 ["Mumbai","BOM",19.0896,72.8656,["bombay"]],["Delhi","DEL",28.5562,77.1,["new delhi"]],["Bengaluru","BLR",13.1986,77.7066,["bangalore"]],["Chennai","MAA",12.9941,80.1709],["Hyderabad","HYD",17.2403,78.4294],["Kolkata","CCU",22.6547,88.4467],
 ["Doha","DOH",25.2731,51.6081,["doha, qatar"]],["Dubai","DXB",25.2532,55.3657,["dubai, uae","dubai, united arab emirates"]],["Abu Dhabi","AUH",24.433,54.6511],["Muscat","MCT",23.5933,58.2844],["Istanbul","IST",41.2753,28.7519],["Singapore","SIN",1.3644,103.9915],["Kuala Lumpur","KUL",2.7456,101.7072],["Bangkok","BKK",13.69,100.7501],["Hong Kong","HKG",22.308,113.9185],["Tokyo","HND",35.5494,139.7798,["haneda"]],["Seoul","ICN",37.4602,126.4407],
 ["London","LHR",51.47,-0.4543,["heathrow"]],["Paris","CDG",49.0097,2.5479],["Frankfurt","FRA",50.0379,8.5622],["Amsterdam","AMS",52.3105,4.7683],["Madrid","MAD",40.4983,-3.5676],["Rome","FCO",41.8003,12.2389],["New York","JFK",40.6413,-73.7781,["new york city"]],["Los Angeles","LAX",33.9416,-118.4085],["San Francisco","SFO",37.6213,-122.379],["Toronto","YYZ",43.6777,-79.6248],["Sydney","SYD",-33.9399,151.1753],["Auckland","AKL",-37.0082,174.785],["Nairobi","NBO",-1.3192,36.9278],["Cape Town","CPT",-33.9715,18.6021]
];
const airportIndex=new Map();for(const [name,code,lat,lon,aliases=[]] of airports)for(const key of [name,code,...aliases])airportIndex.set(key.toLowerCase(),{name,code,lat,lon});
function resolveAirport(value){const key=String(value||"").trim().toLowerCase();return airportIndex.get(key)||null}
const countrySuffixes=new Set(["qatar","uae","united arab emirates","united states","usa","united kingdom","uk","japan","singapore","thailand","india","france","germany","netherlands","italy","spain","canada","australia","new zealand","kenya","south africa","south korea","hong kong"]);
function transitAirports(value){const raw=String(value||"").trim();if(!raw)return [];const exact=resolveAirport(raw);if(exact)return [exact];const stops=[];for(const group of raw.split(/[;|→/]+/).map(s=>s.trim()).filter(Boolean)){for(const part of group.split(",").map(s=>s.trim()).filter(Boolean)){const airport=resolveAirport(part);if(airport){if(stops[stops.length-1]?.code!==airport.code)stops.push(airport)}else if(!countrySuffixes.has(part.toLowerCase()))return null}}return stops}
function routeMap(){const origin=resolveAirport(state.origin),destination=resolveAirport(state.city),via=transitAirports(state.transit);if(!origin||!destination)return "<div class='map'><p class='notice'>Map unavailable: "+esc(!origin?state.origin:state.city)+" is not in the offline airport registry. No location has been guessed.</p></div>";if(!via)return "<div class='map'><p class='notice'>Map unavailable: transit place “"+esc(state.transit)+"” is not in the offline airport registry.</p></div>";const stops=[origin,...via.filter(s=>s.code!==origin.code&&s.code!==destination.code),destination].filter((s,i,a)=>!i||s.code!==a[i-1].code);
 const legPoints=[];for(let leg=0;leg<stops.length-1;leg++){const a=stops[leg],b=stops[leg+1],rad=Math.PI/180,la=a.lat*rad,lb=b.lat*rad,lo=a.lon*rad,lo2=b.lon*rad,va=[Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)],vb=[Math.cos(lb)*Math.cos(lo2),Math.cos(lb)*Math.sin(lo2),Math.sin(lb)],angle=Math.acos(Math.max(-1,Math.min(1,va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2]))),points=[];for(let i=0;i<=32;i++){const t=i/32,s=angle?Math.sin((1-t)*angle)/Math.sin(angle):1,c=angle?Math.sin(t*angle)/Math.sin(angle):0,x=s*va[0]+c*vb[0],y=s*va[1]+c*vb[1],z=s*va[2]+c*vb[2];let lon=Math.atan2(y,x)/rad;if(points.length){while(lon-points[points.length-1][0]>180)lon-=360;while(lon-points[points.length-1][0]<-180)lon+=360}points.push([lon,Math.atan2(z,Math.hypot(x,y))/rad])}legPoints.push(points)}
 const project=([lon,lat])=>[((((lon+180)%360)+360)%360)*3,(90-lat)*3],all=legPoints.flat().map(project),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=36;let width=Math.max(maxX-minX+pad*2,90),height=Math.max(maxY-minY+pad*2,45);if(width/height<2)width=height*2;else height=width/2;const cx=(minX+maxX)/2,cy=(minY+maxY)/2,viewX=Math.max(0,Math.min(1080-width,cx-width/2)),viewY=Math.max(0,Math.min(540-height,cy-height/2)),viewBox=[viewX,viewY,Math.min(width,1080),Math.min(height,540)].map(n=>n.toFixed(1)).join(" ");
 const paths=legPoints.map(points=>{let d="",previous=null;for(const point of points){const [x,y]=project(point);if(previous&&Math.abs(x-previous[0])>540)d+=" ";d+=(d&&!d.endsWith(" ")?"L":"M")+x.toFixed(1)+","+y.toFixed(1);previous=[x,y]}return "<path class='flight' d='"+d+"'/>"}).join(""),labels=stops.map(stop=>{const [x,y]=project([stop.lon,stop.lat]);return "<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='5'><title>"+esc(stop.name)+" ("+stop.code+")</title></circle><text x='"+(x+8).toFixed(1)+"' y='"+(y-8).toFixed(1)+"'>"+stop.code+"</text>"}).join("");
 const wrapper=document.createElement("div");wrapper.innerHTML=document.querySelector("#map-template").innerHTML;const svg=wrapper.querySelector("svg");if(!svg)return "<div class='map'><p class='notice'>Offline map template unavailable.</p></div>";svg.querySelectorAll("text,circle,path.flight,path.flight-path,[class*='flight'],.map-airplane,.route-label,.map-coordinates").forEach(el=>el.remove());svg.classList.add("map-lines");svg.setAttribute("viewBox",viewBox);svg.setAttribute("preserveAspectRatio","xMidYMid meet");svg.setAttribute("role","img");svg.setAttribute("aria-label","Flight route: "+stops.map(s=>s.name).join(" to "));svg.insertAdjacentHTML("beforeend",paths+labels);return "<div class='map'>"+wrapper.innerHTML+"</div>"}
function checks(items,prefix){return items.map((t,i)=>"<label class='task'><input type='checkbox' data-task='"+prefix+i+"' "+(state.done.has(prefix+i)?"checked":"")+"><span>"+esc(t)+"</span></label>").join("")}
function overview(){return heading("Overview",state.name+" · "+state.origin+" → "+state.city)+"<div class='stats'><div><small>Preparation</small><strong>"+Math.round(tasks().filter((_,i)=>state.done.has("task"+i)).length/tasks().length*100)+"%</strong></div><div><small>Departure</small><strong>"+esc(state.date)+"</strong></div></div><div class='grid'><section class='panel'><h2>"+esc(state.city+" · "+state.purpose)+"</h2><p>"+esc(state.nationality+" passport · resident in "+state.residence)+"</p><p>"+esc(state.transit?"Via "+state.transit:"Direct route")+"</p>"+routeMap()+"</section><section class='panel'><h2>Next action</h2><p>Confirm the right immigration pathway for your passport, purpose and dates.</p><span class='badge'>Official confirmation required</span><div class='actions'><button data-go='Visa & entry'>Review requirements</button></div></section></div><section class='panel'><h2>Preparation tasks</h2>"+checks(tasks().slice(0,4),"task")+"</section>"}
function journeys(){return heading("Journeys","Personal information and route")+"<form id='journey' class='panel'><div class='fields'>"+[["name","Full legal name"],["nationality","Passport nationality"],["residence","Country of residence"],["origin","Origin city"],["destination","Destination country"],["city","Destination city"],["transit","Transit countries / cities"],["date","Departure date"]].map(([key,label])=>"<label>"+label+"<input name='"+key+"' "+(key==="transit"?"":"required ")+"value='"+esc(state[key])+"' "+(key==="date"?"type='date'":"")+(key==="transit"?" placeholder='Optional; separate airports with commas or semicolons'":"")+"></label>").join("")+"<label>Travel purpose<select name='purpose'>"+["Study","Work","Tourism","Family","Transit","Relocation"].map(p=>"<option "+(p===state.purpose?"selected":"")+">"+p+"</option>").join("")+"</select></label></div><div class='actions'><button class='primary'>Save journey</button></div><p class='notice'>Use non-sensitive preview information. No passport number or document content is stored.</p></form>"}
function requirements(){return heading("Visa & entry",state.nationality+" passport · "+state.destination+" · "+state.purpose)+"<section class='panel'><span class='badge'>Official confirmation required</span><p>No legal eligibility decision is available in this fallback. Review these preparation categories with the responsible authority.</p>"+categories().map(c=>"<div class='row'><div><h3>"+esc(c)+"</h3><p>Confirm applicability to your "+esc(state.purpose.toLowerCase())+" journey.</p></div><button data-go='Documents'>Prepare evidence</button></div>").join("")+(state.transit?"<div class='row'><div><h3>Transit: "+esc(state.transit)+"</h3><p>Airside transfer and crossing immigration need separate checks.</p></div></div>":"")+"<div class='actions'><a target='_blank' rel='noreferrer' href='"+source()+"'>"+(state.destination==="United Kingdom"?"GOV.UK visa checker":state.destination==="Japan"?"Japan Ministry of Foreign Affairs":"UK government travel-advice directory — discovery only")+" (online)</a><button data-go='Applications'>Application pathway</button></div><p class='notice'>Authority references only; no current rules cached or verified. Deadlines, fees and contacts are not asserted.</p></section>"}
const steps=["Check visa category","Prepare evidence","Review application","Open official application channel","Record submission","Track next steps"];
function applications(){return heading("Applications","Your preparation record — not a government submission")+"<section class='panel'>"+steps.map((s,i)=>"<div class='row'><div><h3>"+(i+1)+". "+s+"</h3><p>"+(i<state.application?"Recorded by you":i===state.application?"Ready to review":"Complete the previous step first")+"</p></div>"+(i===state.application?"<button data-step='"+i+"'>"+(i===4?"I have submitted externally":"Mark reviewed")+"</button>":"")+"</div>").join("")+"<p class='notice'>Suggested sequence only. No application is sent by Meridian.</p><a href='"+source()+"' target='_blank' rel='noreferrer'>Open official source (online)</a></section>"}
function documents(){return heading("Documents","Non-sensitive preparation metadata")+"<section class='panel'><form id='document'><div class='fields'><label>Document name<input name='title' required placeholder='Admission letter record'></label><label>Related requirement<select name='requirement'>"+categories().map(c=>"<option>"+c+"</option>").join("")+"</select></label></div><div class='actions'><button>Add document record</button></div></form>"+state.docs.map((d,i)=>"<div class='row'><div><h3>"+esc(d.title)+"</h3><p>"+esc(d.requirement)+" · "+esc(state.name)+" · "+(d.prepared?"Prepared":"Not prepared")+"</p></div><div><button data-prepared='"+i+"'>"+(d.prepared?"Reopen":"Mark prepared")+"</button> <button data-remove='"+i+"'>Remove</button></div></div>").join("")+"<div class='actions'><button data-go='Applications'>Back to application</button></div></section>"}
function assistant(){return heading("Meridian Assistant","Local intent matching · No external AI connected")+"<section class='panel'><div id='history'>"+state.messages.map(m=>"<div class='message'><strong>"+m.role+"</strong>"+esc(m.text)+"</div>").join("")+"</div><form id='chat'><label>Ask Meridian<input name='question' required placeholder='Ask about tasks, documents or transit'></label><div class='actions'><button class='primary'>Send</button><button type='button' data-prompt='hi'>Say hello</button><button type='button' data-prompt='tasks'>Outstanding tasks</button></div></form></section>"}
function respond(q){const text=q.trim().toLowerCase();if(/^(hi|hello|hey)[!.?]*$/.test(text))return "Hello! How can I help you prepare for travel?";if(/visa|entry|passport|rule/.test(text))return state.nationality+" passport → "+state.destination+" for "+state.purpose+". Open Visa & entry for preparation categories and official references. Official confirmation required.";if(/transit|doha|qatar/.test(text))return "Transit: "+(state.transit||"none entered")+". Confirm airside transfer, baggage and immigration conditions separately.";if(/document|evidence/.test(text))return state.docs.length+" document records. Review "+categories().join(", ")+" in Documents.";if(/task|next|ready|summary|journey/.test(text))return state.origin+" → "+state.city+" on "+state.date+". Outstanding:\n"+tasks().filter((_,i)=>!state.done.has("task"+i)).join("\n");if(/change|update/.test(text))return "Open Journeys to update your route or dates. Nothing has been changed.";return "Are you asking about requirements, documents, tasks or transit? I can match those to this workspace."}
 function show(name){document.querySelector("#crumb").textContent=name;for(const b of nav.children)b.classList.toggle("active",b.textContent===name);const render={"Overview":overview,"Journeys":journeys,"Visa & entry":requirements,"Applications":applications,"Documents":documents,"Tasks":()=>heading("Tasks",state.city+" · Preparation targets")+ "<section class='panel'>"+checks(tasks(),"task")+"</section>","Travel":()=>heading("Travel",state.origin+" → "+state.city)+"<section class='panel'>"+routeMap()+"</section>","Arrival":()=>heading("Arrival",state.city+" · First-day preparation")+"<section class='panel'>"+checks(["Confirm arrival address and transport","Arrange connectivity","Save official emergency contacts","Check local registration guidance"],"arrival")+"</section>","Expenses":()=>heading("Expenses","Record costs in the full application")+"<section class='panel'><p>No expenses recorded in this independent fallback.</p></section>","Settings":()=>heading("Settings","Independent browser-only fallback")+"<section class='panel'><p>Runs directly from this HTML file. No scripts, fonts, map tiles or services are fetched. Changes last for this window.</p><p>For the complete experience, use START_MERIDIAN.bat. No Node.js installation is required.</p></section>","Assistant":assistant};content.innerHTML=(render[name]||overview)()}
for(const name of pages){const b=document.createElement("button");b.textContent=name;b.dataset.go=name;nav.append(b)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.go)show(b.dataset.go);if(b.dataset.step!==undefined){state.application++;show("Applications")}if(b.dataset.prepared!==undefined){const d=state.docs[+b.dataset.prepared];d.prepared=!d.prepared;show("Documents")}if(b.dataset.remove!==undefined){state.docs.splice(+b.dataset.remove,1);show("Documents")}if(b.dataset.prompt){state.messages.push({role:"You",text:b.dataset.prompt},{role:"Assistant",text:respond(b.dataset.prompt)});show("Assistant")}});
document.addEventListener("change",e=>{if(e.target.matches("[data-task]")){if(e.target.checked)state.done.add(e.target.dataset.task);else state.done.delete(e.target.dataset.task)}});
document.addEventListener("submit",e=>{e.preventDefault();const data=new FormData(e.target);if(e.target.id==="journey"){for(const [k,v]of data)state[k]=String(v).trim();state.done.clear();state.application=0;show("Overview")}if(e.target.id==="document"){state.docs.push({title:String(data.get("title")),requirement:String(data.get("requirement")),prepared:false});show("Documents")}if(e.target.id==="chat"){const q=String(data.get("question"));state.messages.push({role:"You",text:q},{role:"Assistant",text:respond(q)});show("Assistant")}});
document.querySelector("#theme").onclick=()=>document.body.classList.toggle("dark");document.querySelector("#assistant").onclick=()=>show("Assistant");show("Overview");
</script>
</body></html>
